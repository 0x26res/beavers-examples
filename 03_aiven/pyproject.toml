[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "beavers-aiven-example"
version = "0.1.0"
description = "Beavers & Aiven Kafka example"
requires-python = ">=3.10,<3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beavers[confluent_kafka,perspective-python,pyarrow]",
  "confluent-kafka[protobuf]",
  "duckdb",
  "googleapis-common-protos",
  "grpcio",
  "grpcio-tools",
  "perspective-python<4",
  "protarrow",
  "protobuf",
  "psycopg2-binary",
  "tornado",
  "websockets",
]
scripts.dashboard = "dashboard:dashboard"
scripts.websocket-feed = "websocket_feed:main"

[dependency-groups]
dev = [
  "aiven-client",
  "pytest",
]

[tool.hatch]
build.hooks.protobuf.dependencies = [
  "hatch-protobuf",
  "grpcio-tools",
]
build.hooks.protobuf.generate_pyi = true
build.hooks.protobuf.generate_grpc = false
build.hooks.protobuf.import_site_packages = true
build.hooks.protobuf.proto_paths = [ "protos" ]
build.hooks.protobuf.output_path = "aiven_protos"
