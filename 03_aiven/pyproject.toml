[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beavers-aiven-example"
version = "0.1.0"
description = "Beavers & Aiven Kafka example"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beavers[pyarrow,confluent_kafka,perspective-python]",
    "confluent-kafka[protobuf]",
    "googleapis-common-protos",
    "grpcio",
    "grpcio-tools",
    "perspective-python<4",
    "protarrow",
    "protobuf",
    "tornado",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.hooks.protobuf]
dependencies = [
  "hatch-protobuf",
  "grpcio-tools",
]
generate_pyi = true
generate_grpc = false
import_site_packages = true
proto_paths = [ "protos" ]
output_path = "aiven_protos"
